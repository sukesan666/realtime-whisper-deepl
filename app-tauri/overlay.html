<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Whisper Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Inter", system-ui, "Segoe UI", sans-serif;
        user-select: none;
        cursor: default;
      }
      /* Rounded translucent black caption panel, like Chrome live captions. */
      .overlay-card {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 8px;
        padding: 16px 20px;
        background: transparent;
        border: none;
        border-radius: 12px;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      .ov-en {
        display: none;
        margin: 0;
        font-size: 24px;
        line-height: 1.4;
        font-weight: 500;
        color: oklch(0.78 0.005 260);
        overflow-wrap: anywhere;
      }
      .ov-ja {
        margin: 0;
        font-family: "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
        font-size: 36px;
        line-height: 1.4;
        font-weight: 700;
        color: white;
        -webkit-text-stroke: 2px black;
        paint-order: stroke fill;
        text-shadow:
          -1px -1px 0 black,
           1px -1px 0 black,
          -1px  1px 0 black,
           1px  1px 0 black;
        overflow-wrap: anywhere;
      }
      .ov-en:empty,
      .ov-ja:empty {
        display: none;
      }
    </style>
    <script type="module" src="/src/overlay.ts" defer></script>
  </head>
  <body>
    <div class="overlay-card" data-tauri-drag-region>
      <p class="ov-en" id="ov-en"></p>
      <p class="ov-ja" id="ov-ja"></p>
    </div>
  </body>
</html>
